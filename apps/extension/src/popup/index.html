<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Segmenta Downloader</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-color: #09090b;
        --card-bg: #121215;
        --border-color: #27272a;
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --brand-primary: #4f46e5;
        --brand-accent: #06b6d4;
        --success: #10b981;
        --danger: #ef4444;
        --warning: #f59e0b;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        width: 360px;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-primary);
        font-size: 13px;
        line-height: 1.5;
        padding: 14px;
        user-select: none;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--border-color);
        margin-bottom: 12px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .logo-icon {
        width: 24px;
        height: 24px;
        border-radius: 6px;
        background: linear-gradient(135deg, var(--brand-primary), var(--brand-accent));
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: 800;
        font-size: 12px;
        box-shadow: 0 2px 8px rgba(79, 70, 229, 0.4);
      }

      .brand-name {
        font-weight: 700;
        font-size: 14px;
        letter-spacing: -0.02em;
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 11px;
        font-weight: 600;
        padding: 3px 8px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.05);
        color: var(--text-secondary);
      }

      .status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background-color: var(--text-secondary);
      }

      .status-pill.online {
        color: var(--success);
        background: rgba(16, 185, 129, 0.12);
        border: 1px solid rgba(16, 185, 129, 0.2);
      }
      .status-pill.online .status-dot {
        background-color: var(--success);
        box-shadow: 0 0 6px var(--success);
      }

      .status-pill.offline {
        color: var(--danger);
        background: rgba(239, 68, 68, 0.12);
        border: 1px solid rgba(239, 68, 68, 0.2);
      }
      .status-pill.offline .status-dot {
        background-color: var(--danger);
      }

      .section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
      }

      .section-title {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-secondary);
      }

      .badge-count {
        font-size: 10px;
        font-weight: 700;
        padding: 1px 6px;
        border-radius: 10px;
        background: var(--brand-primary);
        color: white;
      }

      .card {
        background-color: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 10px;
        margin-bottom: 12px;
      }

      /* Switch toggle styles */
      .toggle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .toggle-info {
        display: flex;
        flex-direction: column;
      }

      .toggle-label {
        font-weight: 600;
        font-size: 12px;
        color: var(--text-primary);
      }

      .toggle-desc {
        font-size: 10px;
        color: var(--text-secondary);
      }

      .switch {
        position: relative;
        display: inline-block;
        width: 38px;
        height: 20px;
      }

      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      .slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #3f3f46;
        transition: 0.2s;
        border-radius: 20px;
      }

      .slider:before {
        position: absolute;
        content: "";
        height: 14px;
        width: 14px;
        left: 3px;
        bottom: 3px;
        background-color: white;
        transition: 0.2s;
        border-radius: 50%;
      }

      input:checked + .slider {
        background-color: var(--brand-primary);
      }

      input:checked + .slider:before {
        transform: translateX(18px);
      }

      .btn {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        background: var(--brand-primary);
        color: #ffffff;
        border: none;
        border-radius: 6px;
        padding: 8px 12px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.15s ease;
      }

      .btn:hover {
        background: #4338ca;
      }

      .stream-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-height: 160px;
        overflow-y: auto;
      }

      .stream-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 8px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 6px;
        font-size: 11px;
        gap: 6px;
      }

      .stream-item:hover {
        background: rgba(255, 255, 255, 0.06);
        border-color: rgba(99, 102, 241, 0.3);
      }

      .stream-info {
        display: flex;
        flex-direction: column;
        overflow: hidden;
        flex: 1;
      }

      .stream-title {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: var(--text-primary);
        font-weight: 500;
      }

      .stream-meta {
        font-size: 10px;
        color: var(--text-secondary);
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .stream-tag {
        font-size: 9px;
        font-weight: 700;
        padding: 1px 4px;
        border-radius: 4px;
        text-transform: uppercase;
      }

      .stream-tag.hls {
        background: rgba(6, 182, 212, 0.15);
        color: var(--brand-accent);
      }

      .stream-tag.dash {
        background: rgba(245, 158, 11, 0.15);
        color: var(--warning);
      }

      .stream-tag.direct {
        background: rgba(16, 185, 129, 0.15);
        color: var(--success);
      }

      .stream-tag.chunk {
        background: rgba(148, 163, 184, 0.15);
        color: var(--text-secondary);
      }

      .btn-download-stream {
        background: #4f46e5;
        border: none;
        color: white;
        border-radius: 4px;
        padding: 3px 8px;
        font-size: 10px;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
        transition: background 0.15s ease;
      }

      .btn-download-stream:hover {
        background: #4338ca;
      }

      .empty-state {
        text-align: center;
        color: var(--text-secondary);
        font-size: 11px;
        padding: 12px 0;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="brand">
        <div class="logo-icon">S</div>
        <div class="brand-name">Segmenta</div>
      </div>
      <div id="status-badge" class="status-pill offline">
        <span class="status-dot"></span>
        <span id="status-text">Desktop Offline</span>
      </div>
    </div>

    <!-- Interception Toggle Card -->
    <div class="card">
      <div class="toggle-row">
        <div class="toggle-info">
          <span class="toggle-label">Auto-Interception</span>
          <span class="toggle-desc">Capture browser file downloads</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="toggle-auto-intercept" checked />
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <!-- Active Tab Detected Streams -->
    <div class="section-header">
      <div class="section-title">Detected Media (Active Tab)</div>
      <span id="stream-count" class="badge-count">0</span>
    </div>
    <div class="card" style="padding: 6px;">
      <div id="stream-container" class="stream-list">
        <div class="empty-state">No media streams sniffed on this tab.</div>
      </div>
    </div>

    <!-- Quick Actions -->
    <button id="btn-download-tab" class="btn" style="margin-bottom: 12px;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
      </svg>
      Grab Video / Audio on Page
    </button>

    <!-- Recent Captured Downloads -->
    <div class="section-header">
      <div class="section-title">Recent Handled Downloads</div>
    </div>
    <div class="card" style="padding: 6px; margin-bottom: 0;">
      <div id="recent-container" class="stream-list">
        <div class="empty-state">No downloads intercepted yet.</div>
      </div>
    </div>

    <script type="module" src="./index.ts"></script>
  </body>
</html>
