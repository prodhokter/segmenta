  <path d="M24 160 H488 M24 256 H488 M24 352 H488 M160 24 V488 M256 24 V488 M352 24 V488" stroke="#334155" stroke-opacity="0.15" stroke-width="2" />

  <!-- Multi-Stream Segmented "S" Symbol -->
  <!-- Top Segment 1 (Speed Slice) -->
  <path d="M370 120 H190 C145.8 120 110 155.8 110 200 C110 215 114.5 229 122 240 L190 240 C175 230 166 215 166 200 C166 186.7 176.7 176 190 176 H370 C385.5 176 398 163.5 398 148 C398 132.5 385.5 120 370 120 Z" fill="url(#seg_grad_1)" filter="url(#glow)" />

  <!-- Accelerated Center Stream (Turbo Slash) -->
  <path d="M120 270 L340 180 C365 170 395 188 395 215 C395 240 375 260 350 270 L170 340 C145 350 115 332 115 305 C115 285 125 272 120 270 Z" fill="url(#seg_grad_2)" />

  <!-- Bottom Segment 3 (Reassembly Foundation) -->
  <path d="M142 392 H322 C366.2 392 402 356.2 402 312 C402 297 397.5 283 390 272 L322 272 C337 282 346 297 346 312 C346 325.3 335.3 336 322 336 H142 C126.5 336 114 348.5 114 364 C114 379.5 126.5 392 142 392 Z" fill="url(#seg_grad_3)" filter="url(#glow)" />

  <!-- Flow Particle Nodes -->
  <circle cx="410" cy="148" r="14" fill="#818cf8" />
  <circle cx="395" cy="215" r="16" fill="#22d3ee" />
  <circle cx="102" cy="364" r="14" fill="#34d399" />
